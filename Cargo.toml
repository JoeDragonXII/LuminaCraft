[package]
name = "luminacraft"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A non-destructive photography workflow prototype"
default-run = "luminacraft"

[[bin]]
name = "luminacraft-launcher"
path = "src/launcher.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
quick-xml = "0.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
eframe = { version = "0.36", default-features = false, features = ["glow", "wgpu", "accesskit", "default_fonts"] }
egui = "0.36"
log = "0.4"
pollster = "1"
lightcraft-ui-egui = { path = "upstream/lightcraft/crates/ui-egui" }
lightcraft-sysmem = { path = "upstream/lightcraft/crates/sysmem" }
rfd = "0.17"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
url = "2"
keyring = { version = "3.6", features = ["windows-native"] }
zip = { version = "7.2", default-features = false }
libloading = "0.8.9"
tempfile = "3"
lightcraft-engine = { path = "upstream/lightcraft/crates/engine", features = ["sam", "denoise"] }
lightcraft-catalog = { path = "upstream/lightcraft/crates/catalog" }
lightcraft-raw = { path = "upstream/lightcraft/crates/raw" }
lightcraft-meta = { path = "upstream/lightcraft/crates/meta" }
lightcraft-raster = { path = "upstream/lightcraft/crates/raster" }
lightcraft-pipeline = { path = "upstream/lightcraft/crates/pipeline" }
lightcraft-develop = { path = "upstream/lightcraft/crates/develop" }
lightcraft-codecs = { path = "upstream/lightcraft/crates/codecs", default-features = false }
photocraft-algo = { path = "vendor/photocraft/crates/algo" }
lightcraft-geom = { path = "upstream/lightcraft/crates/geom" }
lightcraft-faces = { path = "upstream/lightcraft/crates/faces" }

[dev-dependencies]
lightcraft-denoise-core = { path = "upstream/lightcraft/crates/denoise-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1



